<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正畸复诊管理系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登录页面 -->
  <div id="authPage" class="auth-page">
    <div class="auth-card">
      <h2>🦷 正畸复诊管理系统</h2>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">登录</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">注册</button>
      </div>
      <div id="loginForm" class="auth-form">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="loginUsername" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary auth-submit" onclick="doLogin()">登录</button>
      </div>
      <div id="registerForm" class="auth-form" style="display:none;">
        <div class="form-group">
          <label>门诊名称</label>
          <input type="text" id="regClinicName" placeholder="如：阳光口腔正畸中心">
        </div>
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="英文或数字，用于登录">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="至少6位">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="regPasswordConfirm" placeholder="再输入一次密码">
        </div>
        <button class="btn btn-primary auth-submit" onclick="doRegister()">注册</button>
      </div>
      <div id="authError" class="auth-error" style="display:none;"></div>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="mainApp" class="container" style="display:none;">
    <!-- 顶部标题栏 -->
    <header class="header">
      <div class="header-left">
        <h1>🦷 正畸复诊管理</h1>
        <p class="subtitle" id="clinicNameDisplay"></p>
      </div>
      <div class="header-right">
        <button class="btn btn-primary" onclick="showAddPatientModal()">
          ➕ 新增患者
        </button>
        <button class="btn btn-secondary" onclick="exportCSV()">
          📤 导出表格
        </button>
        <button class="btn btn-outline" onclick="showBatchImportModal()">
          📥 批量导入
        </button>
        <button class="btn btn-outline" id="adminBtn" style="display:none;" onclick="showAdminModal()">
          🏥 门诊管理
        </button>
        <button class="btn btn-outline" onclick="logout()">退出登录</button>
      </div>
    </header>

    <!-- 统计卡片 -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-number" id="stat-total">0</div>
        <div class="stat-label">患者总数</div>
      </div>
      <div class="stat-card stat-warning">
        <div class="stat-number" id="stat-upcoming">0</div>
        <div class="stat-label">7天内复诊</div>
      </div>
      <div class="stat-card stat-danger">
        <div class="stat-number" id="stat-overdue">0</div>
        <div class="stat-label">已逾期</div>
      </div>
      <div class="stat-card stat-muted">
        <div class="stat-number" id="stat-not-booked">0</div>
        <div class="stat-label">未预约</div>
      </div>
      <div class="stat-card stat-completed">
        <div class="stat-number" id="stat-completed">0</div>
        <div class="stat-label">已完成</div>
      </div>
    </div>

    <!-- 搜索和筛选 -->
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 搜索患者姓名..." oninput="loadPatients()">
      </div>
      <div class="sort-box">
        <select id="sortSelect" onchange="loadPatients()">
          <option value="overdue">按逾期优先</option>
          <option value="next_visit">按复诊日期</option>
          <option value="name">按姓名</option>
        </select>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="showCompleted" onchange="loadPatients()">
        <span>显示已完成</span>
      </label>
      <button class="btn btn-outline" onclick="loadPatients()">🔄 刷新</button>
    </div>

    <!-- 患者列表表格 -->
    <div class="table-container">
      <table class="patient-table">
        <thead>
          <tr>
            <th style="width:40px;">序号</th>
            <th>患者姓名</th>
            <th style="width:140px;">上次复诊</th>
            <th style="width:140px;">下次复诊</th>
            <th style="width:100px;">状态</th>
            <th style="width:280px;">预约下次</th>
            <th style="width:100px;">操作</th>
          </tr>
        </thead>
        <tbody id="patientTableBody">
          <!-- 动态填充 -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        <p>暂无患者数据</p>
        <button class="btn btn-primary" onclick="showAddPatientModal()">➕ 添加第一位患者</button>
      </div>
    </div>

    <footer class="footer">
      <p>数据保存在服务器，请定期导出备份</p>
    </footer>
  </div>

  <!-- 新增患者弹窗 -->
  <div class="modal" id="addPatientModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>新增患者</h3>
        <button class="close-btn" onclick="closeModal('addPatientModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>患者姓名 *</label>
          <input type="text" id="newPatientName" placeholder="请输入姓名">
        </div>
        <div class="form-group">
          <label>下次复诊日期</label>
          <input type="date" id="newPatientNextDate">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('addPatientModal')">取消</button>
        <button class="btn btn-primary" onclick="addPatient()">确认添加</button>
      </div>
    </div>
  </div>

  <!-- 患者详情弹窗 -->
  <div class="modal" id="patientDetailModal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="detailPatientName">患者详情</h3>
        <button class="close-btn" onclick="closeModal('patientDetailModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="detail-info">
          <div class="detail-item">
            <span class="detail-label">下次复诊：</span>
            <span id="detailNextDate" class="detail-value">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">复诊总次数：</span>
            <span id="detailVisitCount" class="detail-value">-</span>
          </div>
        </div>

        <h4 style="margin-top:20px; margin-bottom:10px;">历史复诊记录</h4>
        <div class="records-list" id="recordsList">
          <!-- 动态填充 -->
        </div>

        <div style="margin-top:15px;">
          <button class="btn btn-outline" onclick="showAddRecordForm()">➕ 补录复诊记录</button>
        </div>

        <div id="addRecordForm" style="display:none; margin-top:15px; padding:15px; background:#f5f5f5; border-radius:8px;">
          <div class="form-group">
            <label>复诊日期 *</label>
            <input type="date" id="newRecordDate">
          </div>
          <div class="form-group">
            <label>备注</label>
            <input type="text" id="newRecordNote" placeholder="选填">
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="addRecord()">确认添加</button>
            <button class="btn btn-outline" onclick="hideAddRecordForm()">取消</button>
          </div>
        </div>

        <div style="margin-top:20px; padding-top:15px; border-top:1px solid #eee;">
          <button class="btn btn-outline" onclick="openEditNameModal()">✏️ 修改姓名</button>
          <button class="btn btn-complete" id="toggleCompleteBtn" onclick="toggleComplete()">标记治疗完成</button>
          <button class="btn btn-danger-outline" onclick="deletePatient()">🗑 删除患者</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 修改日期弹窗 -->
  <div class="modal" id="editDateModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="editDateTitle">修改复诊日期</h3>
        <button class="close-btn" onclick="closeModal('editDateModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>下次复诊日期</label>
          <input type="date" id="editNextDate">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('editDateModal')">取消</button>
        <button class="btn btn-primary" onclick="submitEditDate()">保存修改</button>
      </div>
    </div>
  </div>

  <!-- 修改患者姓名弹窗 -->
  <div class="modal" id="editNameModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>修改患者姓名</h3>
        <button class="close-btn" onclick="closeModal('editNameModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>患者姓名 *</label>
          <input type="text" id="editPatientName">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('editNameModal')">取消</button>
        <button class="btn btn-primary" onclick="submitEditName()">保存修改</button>
      </div>
    </div>
  </div>

  <!-- 批量导入弹窗 -->
  <div class="modal" id="batchImportModal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3>批量导入患者</h3>
        <button class="close-btn" onclick="closeModal('batchImportModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom:10px; color:#6b7280; font-size:14px;">
          上传 CSV 文件，格式：第一行是表头（姓名,下次复诊日期），下面每行一个患者。日期格式 2026-09-24，不填日期留空即可。
        </p>
        <div style="margin-bottom:10px;">
          <button class="btn btn-outline" onclick="downloadCSVTemplate()">📄 下载模板</button>
        </div>
        <div class="form-group">
          <label>选择 CSV 文件</label>
          <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSVUpload(event)">
        </div>
        <div id="csvPreview" style="display:none; margin-top:15px;">
          <h4 style="margin-bottom:8px;">预览（前5条）</h4>
          <div id="csvPreviewContent" style="max-height:200px; overflow-y:auto; border:1px solid #e5e7eb; border-radius:8px; padding:10px; background:#f9fafb;"></div>
          <p id="csvTotalCount" style="margin-top:8px; color:#6b7280; font-size:13px;"></p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('batchImportModal')">取消</button>
        <button class="btn btn-primary" onclick="submitBatchImport()" id="batchImportBtn" disabled>确认导入</button>
      </div>
    </div>
  </div>

  <!-- 确认复诊弹窗 -->
  <div class="modal" id="confirmVisitModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>确认复诊</h3>
        <button class="close-btn" onclick="closeModal('confirmVisitModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirmVisitText" style="margin-bottom:15px;"></p>
        <div class="form-group">
          <label>新的下次复诊日期（选填，不填则暂不预约）</label>
          <input type="date" id="newNextDate">
        </div>
        <div class="form-group">
          <label>本次备注（选填）</label>
          <input type="text" id="visitNote" placeholder="比如：调整钢丝、换牙套等">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('confirmVisitModal')">取消</button>
        <button class="btn btn-primary" onclick="submitConfirmVisit()">确认完成</button>
      </div>
    </div>
  </div>

  <!-- 门诊管理弹窗 -->
  <div id="adminModal" class="modal">
    <div class="modal-content" style="max-width:600px;">
      <div class="modal-header">
        <h2>🏥 门诊管理</h2>
        <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
      </div>
      <div style="padding:20px;">
        <p style="color:#6b7280;margin-bottom:15px;font-size:14px;">所有注册的门诊列表，可以重置密码</p>
        <div id="clinicList" style="display:flex;flex-direction:column;gap:10px;"></div>
      </div>
    </div>
  </div>

  <!-- 重置密码弹窗 -->
  <div id="resetPasswordModal" class="modal">
    <div class="modal-content" style="max-width:400px;">
      <div class="modal-header">
        <h2>🔑 重置密码</h2>
        <button class="close-btn" onclick="closeModal('resetPasswordModal')">✕</button>
      </div>
      <div style="padding:20px;">
        <p id="resetClinicName" style="font-weight:bold;margin-bottom:15px;"></p>
        <div class="form-group">
          <label>新密码</label>
          <input type="password" id="resetNewPassword" placeholder="至少6位">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="resetNewPasswordConfirm" placeholder="再输入一次">
        </div>
        <div style="display:flex;gap:10px;margin-top:15px;">
          <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('resetPasswordModal')">取消</button>
          <button class="btn btn-primary" style="flex:1;" onclick="submitResetPassword()">确认重置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 提示消息 -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
